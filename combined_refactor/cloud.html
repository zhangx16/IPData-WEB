<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPData-WEB 云厂商 IP 优选</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#192638;font:15px system-ui}main{max-width:1180px;margin:40px auto;padding:0 20px}h1{margin-bottom:8px}p{color:#617185}section{background:white;border:1px solid #dce3ed;border-radius:12px;padding:24px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}label{display:block;font-size:13px;color:#526176}input,textarea{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}textarea{height:125px}button{padding:10px 18px;border:0;border-radius:6px;background:#2459df;color:white;margin:14px 8px 0 0;cursor:pointer}button:disabled{opacity:.5;cursor:default}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e4e9f0}pre{white-space:pre-wrap;word-break:break-all}#status{color:#2459df} .scroll{overflow:auto}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}main{margin:20px auto}}
</style><main><h1>IPData-WEB</h1><p>云厂商 IP 优选 · TLS → CF 特征 → Trace → 双域名复验</p><section><form id="form"><label>目标 IP / CIDR（每行一个；只扫描自有或获授权的目标）<textarea id="targets" required placeholder="输入云厂商网段，例如 192.0.2.0/24（文档示例，请替换）"></textarea></label><label>导入网段文件<input type="file" id="file" accept=".txt,.csv"></label><br><div class="grid">
<label>服务商标签<input id="provider" value="custom" list="providers"><datalist id="providers"><option>DMIT</option><option>搬瓦工</option><option>Vultr</option><option>AWS</option><option>Azure</option><option>自定义</option></datalist></label><label>端口<input id="ports" value="443,8443" required></label><label>探测 SNI / Host<input id="sni" value="www.cloudflare.com" required></label><label>复验 SNI / Host<input id="verify_sni" value="one.one.one.one"></label><label>并发<input id="concurrency" type="number" value="32" min="1" max="512"></label><label>请求上限 / 秒<input id="rate" type="number" value="50" min="1" max="2000"></label><label>单次超时 ms<input id="timeout_ms" type="number" value="4000" min="100" max="30000"></label><label>复测轮数<input id="rounds" type="number" value="3" min="1" max="10"></label></div><label style="margin-top:16px"><input style="display:inline;width:auto" id="insecure" type="checkbox"> 关闭证书验证（结果仅作特征探测，不证明服务身份）</label><button id="start">开始优选</button><button type="button" id="stop" disabled>停止</button><span id="status">等待扫描</span></form></section><section><div class="grid"><label>证据筛选<select id="filter"><option value="hits">全部命中</option><option value="dual_verified">双域名确认</option><option value="trace_valid">Trace 有效</option><option value="cf_headers">仅 CF 响应头</option><option value="all">全部记录</option></select></label><label>延迟上限 ms<input id="max" type="number" placeholder="不限"></label><label>最低成功率 %<input id="min" type="number" min="0" max="100" value="0"></label></div><button id="csv">导出筛选 CSV</button><button id="json">导出完整证据 JSON</button><div class="scroll"><table><thead><tr><th>IP:端口</th><th>服务商</th><th>证据</th><th>成功率</th><th>TTFB 中位数 ↑</th><th>CF 机房</th></tr></thead><tbody id="rows"></tbody></table></div><p>点击结果查看逐次探测证据。TTFB 包含 TCP/TLS 建连；成功率为 HTTPS CF 特征请求成功率，不是 ICMP 丢包率。</p><pre id="detail"></pre></section><p>CF 响应不能单独证明 Reality 或代理可用。网页记录仅在当前页面内存中，关闭前请导出。IPv4/IPv6 均支持，网段逐地址探测。</p></main><script>
const $=id=>document.getElementById(id);let data=[],controller,total=0,done=0,hits=0;const names={none:'未命中',cf_headers:'CF 响应头',trace_valid:'Trace 有效',dual_verified:'双域名确认'};
$('file').onchange=async()=>{if($('file').files[0])$('targets').value=await $('file').files[0].text()};
function filtered(){return data.filter(r=>($('filter').value==='all'||($('filter').value==='hits'?r.success>0:r.evidence===$('filter').value))&&(!$('max').value||(r.success>0&&r.median_ms<=+$('max').value))&&r.success/r.rounds*100>=+$('min').value).sort((a,b)=>b.success/b.rounds-a.success/a.rounds||a.median_ms-b.median_ms)}
function render(){const f=filtered();$('rows').replaceChildren();for(const r of f.slice(0,500)){const tr=document.createElement('tr');for(const val of [r.ip.includes(':')?'['+r.ip+']:'+r.port:r.ip+':'+r.port,r.provider,names[r.evidence],Math.round(r.success/r.rounds*100)+'%',r.success?r.median_ms.toFixed(1):'—',r.observations[0]?.colo||'—']){const td=document.createElement('td');td.textContent=val;tr.append(td)}tr.onclick=()=>$('detail').textContent=JSON.stringify(r,null,2);$('rows').append(tr)} }
for(const id of ['filter','max','min'])$(id).oninput=render;
$('stop').onclick=()=>controller?.abort();$('form').onsubmit=async e=>{e.preventDefault();const c={};for(const id of ['targets','ports','sni','verify_sni','provider'])c[id]=$(id).value.trim();for(const id of ['concurrency','rate','timeout_ms','rounds'])c[id]=+$(id).value;c.insecure=$('insecure').checked;controller=new AbortController();$('start').disabled=true;$('stop').disabled=false;data=[];done=hits=0;render();let timer=setInterval(render,1000);try{const res=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c),signal:controller.signal});if(!res.ok)throw Error(await res.text());const reader=res.body.getReader(),dec=new TextDecoder();let buf='',finished=false;while(true){const {value,done:end}=await reader.read();if(end)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const r=JSON.parse(buf.slice(0,i));buf=buf.slice(i+1);if(r.total)total=r.total;else if(r.done)finished=true;else{data.push(r);done++;if(r.success)hits++}$('status').textContent=`已测 ${done}/${total} · 命中 ${hits}`}}$('status').textContent+=(finished?' · 完成':' · 连接中断')}catch(e){$('status').textContent=e.name==='AbortError'?`已停止 · 保留 ${data.length} 条记录`:e.message}finally{clearInterval(timer);render();$('start').disabled=false;$('stop').disabled=true}};
function download(text,name,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('json').onclick=()=>download(JSON.stringify(data,null,2),'ipdata-evidence.json','application/json');$('csv').onclick=()=>{const q=x=>'"'+String(x).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const lines=[['ip','port','provider','evidence','success','rounds','median_ms'],...filtered().map(r=>[r.ip,r.port,r.provider,r.evidence,r.success,r.rounds,r.median_ms])];download('\ufeff'+lines.map(r=>r.map(q).join(',')).join('\r\n'),'ipdata-results.csv','text/csv;charset=utf-8')};
</script></html>
